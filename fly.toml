# fly.toml - Configuración para Laravel en Fly.io

app = "sistema-inventario-9x4gqq"
primary_region = "bog" # Bogotá (la más cercana/de baja latencia para Latam)

[build]
  # Utiliza la imagen oficial optimizada de Fly.io para Laravel
  image = "flyio/laravel-buildpack:latest"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "info"
  SESSION_DRIVER = "cookie"
  CACHE_STORE = "file"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/var/www/html/database/database.sqlite"

[processes]
  app = ""

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# Montar un volumen persistente para que no se pierdan los datos de la base de datos SQLite
[[mounts]]
  source = "sqlite_data"
  destination = "/var/www/html/database"

# Tareas automáticas pre-despliegue (Ejecuta migraciones)
[deploy]
  release_command = "php artisan migrate --force"