# fly.toml app configuration file generated for sistema-inventario-nncdyq on 2026-08-08T07:43:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sistema-inventario-nncdyq'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'php artisan migrate --force'

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  CACHE_STORE = 'file'
  DB_CONNECTION = 'sqlite'
  DB_DATABASE = '/var/www/html/database/database.sqlite'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  SESSION_DRIVER = 'cookie'

[[mounts]]
  source = 'sqlite_data'
  destination = '/var/www/html/database'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
